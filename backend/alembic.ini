# A generic, single database configuration.

[alembic]
script_location = alembic
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/samanvay

[post_write_hooks]

[logging]
root = {level = "WARN", handlers = ["console"], qualname = ""}
handlers = [{"class" = "logging.StreamHandler", "args" = "(sys.stderr,),", "level" = "NOTSET", "formatter" = "generic"}]
formatters = {"generic" = {"format" = "%(levelname)-5.5s [%(asctime)s] data: %(message)s", "datefmt" = "%H:%M:%S"}}
